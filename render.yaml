services:
  - type: web
    name: calendar-app-wbb8
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        value: titkos_kulcs_ide
    healthCheckPath: /
    autoDeploy: true 